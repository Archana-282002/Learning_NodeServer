/employees:
  get:
    summary: Get all employees
    description: Retrieves all employee records with their associated department name.
    operationId: getAllEmployees
    tags:
      - Employees
    responses:
      '200':
        description: List of employees with department names
        content:
          application/json:
            schema:
              type: object
              properties:
                employees:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 101
                      name:
                        type: string
                        example: "Archana"
                      firstName:
                        type: string
                        example: "Archana"
                      lastName:
                        type: string
                        example: "Amirthalingam"
                      email:
                        type: string
                        example: "archana@example.com"
                      departmentId:
                        type: integer
                        example: 1
                      department:
                        type: string
                        example: "Engineering"
                total:
                  type: integer
      '500':
        description: Server error
    security:
      - bearerAuth: []

  post:
    summary: Create a new employee
    description: Creates an employee record and assigns them to a specific department.
    operationId: createEmployee
    tags:
      - Employees
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              firstName:
                type: string
                example: "Archana"
              lastName:
                type: string
                example: "Amirthalingam"
              email:
                type: string
                format: email
                example: "archana@example.com"
              phoneNumber:
                type: string
                example: "+1-555-0199"
              salary:
                type: number
                example: 85000.00
              departmentId:
                type: integer
                example: 2
                description: The ID of the department the employee belongs to.
            required:
              - firstName
              - lastName
              - email
              - departmentId
    responses:
      '201':
        description: Employee created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Employee created successfully"
                employee:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 101
                    name:
                      type: string
                      example: "Archana"
                    email:
                      type: string
                    departmentId:
                      type: integer
                    department:
                      type: string
                      example: "Engineering"
      '400':
        description: Bad request, department not found or validation error
      '409':
        description: Duplicate email conflict
      '500':
        description: Server error
    security:
      - bearerAuth: []

/departments/{departmentId}/employees:
  get:
    summary: Get employees by department ID
    description: Retrieves all employee records belonging to a specific department, showing the department name.
    operationId: getEmployeesByDepartment
    tags:
      - Employees
    parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
        example: 2
        description: The department ID to filter employees by.
    responses:
      '200':
        description: List of employees belonging to the department
        content:
          application/json:
            schema:
              type: object
              properties:
                department:
                  type: string
                  example: "Engineering"
                departmentId:
                  type: integer
                  example: 2
                employees:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 101
                      name:
                        type: string
                        example: "Archana"
                      firstName:
                        type: string
                      lastName:
                        type: string
                      email:
                        type: string
                      departmentId:
                        type: integer
                      department:
                        type: string
                        example: "Engineering"
                total:
                  type: integer
      '404':
        description: Department not found
      '500':
        description: Server error
    security:
      - bearerAuth: []
